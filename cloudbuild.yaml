# ── Cloud Build: автоматический деплой в Cloud Run ─────────────
# Запускается при push в GitHub (настроить триггер в Cloud Build)
#
# ВАЖНО: для работы METAR задайте substitution _CHECKWX_API_KEY
# в настройках триггера Cloud Build (или через --substitutions)

substitutions:
  _CHECKWX_API_KEY: ''

steps:
  # Шаг 1: Сборка Docker-образа
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/loadsheet-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/loadsheet-app:latest'
      - '.'

  # Шаг 2: Push в Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/loadsheet-app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/loadsheet-app:latest'

  # Шаг 3: Деплой в Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'loadsheet-app'
      - '--image=gcr.io/$PROJECT_ID/loadsheet-app:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=CHECKWX_API_KEY=$_CHECKWX_API_KEY'

# Образы хранятся в Artifact Registry
images:
  - 'gcr.io/$PROJECT_ID/loadsheet-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/loadsheet-app:latest'

# Таймаут сборки
timeout: '600s'
